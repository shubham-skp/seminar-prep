<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>If statement flowchart</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect width="500" height="290" fill="#ffffff"/>

  <!-- Start -->
  <circle cx="240" cy="18" r="7" fill="#222"/>
  <line x1="240" y1="25" x2="240" y2="56" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="240,58 310,90 240,122 170,90" fill="#2b2b2b"/>
  <text x="240" y="95" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">condition</text>

  <!-- True branch -->
  <line x1="240" y1="122" x2="240" y2="155" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="228" y="140" font-size="13" font-weight="bold" text-anchor="end" fill="#222">If condition</text>
  <text x="228" y="156" font-size="13" font-weight="bold" text-anchor="end" fill="#222">is true</text>

  <!-- Conditional code box -->
  <rect x="190" y="157" width="100" height="40" fill="#2b2b2b"/>
  <text x="240" y="174" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">conditional</text>
  <text x="240" y="189" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">code</text>

  <!-- False branch -->
  <polyline points="310,90 385,90 385,218 240,218" fill="none" stroke="#222" stroke-width="2"/>
  <text x="370" y="128" font-size="13" font-weight="bold" text-anchor="end" fill="#222">If condition</text>
  <text x="370" y="144" font-size="13" font-weight="bold" text-anchor="end" fill="#222">is false</text>

  <!-- Down to end -->
  <line x1="240" y1="197" x2="240" y2="243" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- End symbol -->
  <circle cx="240" cy="260" r="16" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="240" cy="260" r="11" fill="#222"/>
</svg>
