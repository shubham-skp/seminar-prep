<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 350" width="590" height="350" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Nested if statement flowchart</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect width="590" height="350" fill="#ffffff"/>

  <!-- Nested region highlight -->
  <rect x="295" y="46" width="285" height="204" rx="8" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="572" y="60" font-size="11" font-style="italic" text-anchor="end" fill="#777">inner if-else (nested)</text>

  <!-- Start -->
  <circle cx="130" cy="18" r="7" fill="#222"/>
  <line x1="130" y1="25" x2="130" y2="73" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Outer decision -->
  <polygon points="130,72 190,105 130,138 70,105" fill="#111"/>
  <text x="130" y="102" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">outer</text>
  <text x="130" y="115" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">condition</text>

  <!-- Outer true -> inner decision -->
  <line x1="190" y1="105" x2="309" y2="105" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="198" y="78" font-size="12" font-weight="bold" fill="#222">If outer condition</text>
  <text x="198" y="93" font-size="12" font-weight="bold" fill="#222">is true</text>

  <!-- Inner decision -->
  <polygon points="370,72 430,105 370,138 310,105" fill="#111"/>
  <text x="370" y="102" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">inner</text>
  <text x="370" y="115" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">condition</text>

  <!-- Inner true -->
  <polyline points="430,105 500,105 500,153" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="436" y="82" font-size="12" font-weight="bold" fill="#222">If inner</text>
  <text x="436" y="96" font-size="12" font-weight="bold" fill="#222">is true</text>
  <rect x="440" y="155" width="120" height="34" fill="#2b2b2b"/>
  <text x="500" y="176" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">inner if code</text>

  <!-- Inner false -->
  <line x1="370" y1="138" x2="370" y2="197" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="158" font-size="12" font-weight="bold" text-anchor="end" fill="#222">If inner</text>
  <text x="360" y="173" font-size="12" font-weight="bold" text-anchor="end" fill="#222">is false</text>
  <rect x="310" y="199" width="120" height="34" fill="#2b2b2b"/>
  <text x="370" y="220" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">inner else code</text>

  <!-- Outer false -->
  <line x1="130" y1="138" x2="130" y2="197" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="158" font-size="12" font-weight="bold" text-anchor="end" fill="#222">If outer condition</text>
  <text x="120" y="173" font-size="12" font-weight="bold" text-anchor="end" fill="#222">is false</text>
  <rect x="70" y="199" width="120" height="34" fill="#2b2b2b"/>
  <text x="130" y="220" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">outer else code</text>

  <!-- Merge paths -->
  <polyline points="500,189 500,272 136,272" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="233" x2="370" y2="272" stroke="#222" stroke-width="2"/>

  <!-- Down to end -->
  <line x1="130" y1="233" x2="130" y2="300" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- End symbol -->
  <circle cx="130" cy="318" r="16" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="130" cy="318" r="11" fill="#222"/>
</svg>
