<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" width="540" height="520" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Switch statement flowchart</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#ffffff"/>

  <!-- Start -->
  <circle cx="195" cy="18" r="8" fill="#222"/>
  <line x1="195" y1="26" x2="195" y2="80" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Expression diamond -->
  <polygon points="195,82 262,127 195,172 128,127" fill="#111"/>
  <text x="195" y="132" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">expression</text>

  <!-- Left spine with break -->
  <line x1="195" y1="172" x2="195" y2="346" stroke="#222" stroke-width="2"/>
  <line x1="195" y1="362" x2="195" y2="430" stroke="#222" stroke-width="2"/>
  <line x1="178" y1="356" x2="212" y2="334" stroke="#222" stroke-width="2"/>
  <line x1="178" y1="372" x2="212" y2="350" stroke="#222" stroke-width="2"/>

  <!-- Case branches -->
  <line x1="195" y1="205" x2="293" y2="205" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="198" font-size="13" font-weight="bold" fill="#222">case 1</text>
  <rect x="295" y="193" width="140" height="24" fill="#2b2b2b"/>
  <text x="365" y="210" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">code block 1</text>

  <line x1="195" y1="253" x2="293" y2="253" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="246" font-size="13" font-weight="bold" fill="#222">case 2</text>
  <rect x="295" y="241" width="140" height="24" fill="#2b2b2b"/>
  <text x="365" y="258" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">code block 2</text>

  <line x1="195" y1="301" x2="293" y2="301" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="208" y="294" font-size="13" font-weight="bold" fill="#222">case 3</text>
  <rect x="295" y="289" width="140" height="24" fill="#2b2b2b"/>
  <text x="365" y="306" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">code block 3</text>

  <line x1="195" y1="430" x2="293" y2="430" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="208" y="423" font-size="13" font-weight="bold" fill="#222">default</text>
  <rect x="295" y="418" width="140" height="24" fill="#2b2b2b"/>
  <text x="365" y="435" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">code block N</text>

  <!-- Right spine with break -->
  <line x1="435" y1="205" x2="490" y2="205" stroke="#222" stroke-width="2"/>
  <line x1="490" y1="205" x2="490" y2="346" stroke="#222" stroke-width="2"/>
  <line x1="490" y1="362" x2="490" y2="477" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="473" y1="356" x2="507" y2="334" stroke="#222" stroke-width="2"/>
  <line x1="473" y1="372" x2="507" y2="350" stroke="#222" stroke-width="2"/>

  <!-- Block outputs joining right spine -->
  <line x1="435" y1="253" x2="490" y2="253" stroke="#222" stroke-width="2"/>
  <line x1="435" y1="301" x2="490" y2="301" stroke="#222" stroke-width="2"/>
  <line x1="435" y1="430" x2="490" y2="430" stroke="#222" stroke-width="2"/>

  <!-- Join markers -->
  <g stroke="#222" stroke-width="2">
    <circle cx="490" cy="253" r="8" fill="#fff"/>
    <circle cx="490" cy="301" r="8" fill="#fff"/>
    <circle cx="490" cy="430" r="8" fill="#fff"/>
  </g>
  <circle cx="490" cy="253" r="4" fill="#222"/>
  <circle cx="490" cy="301" r="4" fill="#222"/>
  <circle cx="490" cy="430" r="4" fill="#222"/>

  <!-- End symbol -->
  <circle cx="490" cy="496" r="16" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="490" cy="496" r="11" fill="#222"/>
</svg>
