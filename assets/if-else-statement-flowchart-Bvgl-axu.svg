<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>If-else statement flowchart</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect width="320" height="320" fill="#ffffff"/>

  <!-- Start -->
  <circle cx="105" cy="18" r="7" fill="#222"/>
  <line x1="105" y1="25" x2="105" y2="73" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="105,72 168,105 105,138 42,105" fill="#111"/>
  <text x="105" y="109" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">condition</text>

  <!-- True branch -->
  <polyline points="168,105 230,105 230,153" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="76" font-size="12" font-weight="bold" fill="#222">If condition</text>
  <text x="165" y="92" font-size="12" font-weight="bold" fill="#222">is true</text>

  <rect x="172" y="155" width="116" height="34" fill="#2b2b2b"/>
  <text x="230" y="176" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">if code</text>

  <!-- False branch -->
  <line x1="105" y1="138" x2="105" y2="197" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="95" y="158" font-size="12" font-weight="bold" text-anchor="end" fill="#222">If condition</text>
  <text x="95" y="174" font-size="12" font-weight="bold" text-anchor="end" fill="#222">is false</text>

  <rect x="46" y="199" width="118" height="34" fill="#2b2b2b"/>
  <text x="105" y="220" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">else code</text>

  <!-- If code rejoins main line -->
  <polyline points="230,189 230,256 110,256" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Down to end -->
  <line x1="105" y1="233" x2="105" y2="272" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- End symbol -->
  <circle cx="105" cy="290" r="16" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="105" cy="290" r="11" fill="#222"/>
</svg>
